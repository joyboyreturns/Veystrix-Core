name: CI

on:
  push:
    branches: [main, qwen3.8-flash-next, nemotron3.5-lightning]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Install pinned runtime
        run: python -m pip install .
      - name: Test shared runtime
        run: python -m unittest discover -s veystrix/tests -t . -p 'test_*.py' -q
      - name: Test Flash-Next runtime
        run: python -m unittest discover -s models/flashnext/tests/unit -t . -p 'test_*.py' -q
      - name: Test Nemotron runtime (synthetic, model-free)
        run: python -m unittest models.nemotron35.test_synthetic models.nemotron35.test_real_layout models.nemotron35.test_backend models.nemotron35.test_full_size_structure models.nemotron35.test_template_parity -q
      - name: Secret scan
        run: python scripts/security/secret_scan.py

  app:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Test the macOS app logic (no engine, no model)
        run: swift test --package-path apps/macos/Veystrix
      - name: Build the app (development, ad-hoc signed)
        run: packaging/macos/build_app.sh
