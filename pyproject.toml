[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "veystrix"
version = "3.8.1.dev0"
description = "Veystrix: local inference engine for Apple Silicon (formerly MACQWEN)"
readme = "README.md"
requires-python = ">=3.12"
# Proprietary freeware. The combined work still contains MIT-licensed code (copyright 1architect):
# see LICENSE, LICENSES/ and legal/. Not open source as a whole.
license = "LicenseRef-Veystrix-Freeware-Draft"
license-files = ["LICENSE", "NOTICE", "LICENSES/*", "legal/FREEWARE-LICENSE.txt", "legal/THIRD_PARTY_NOTICES.md"]
authors = [{ name = "Veystrix" }, { name = "1architect" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: MacOS X",
  "Operating System :: MacOS :: MacOS X",
  "Programming Language :: Python :: 3.12",
]

dependencies = [
  "mlx==0.32.2",
  "mlx-lm==0.31.3",
  "mlx-vlm==0.6.17",
  "transformers==5.16.1",
  "numpy==2.5.2",
  "requests==2.34.2",
  "huggingface-hub==1.29.0",
]

[project.scripts]
veystrix = "macqwen.cli:main"
macqwen = "macqwen.cli:main"   # compatibility name; kept for existing scripts

[project.urls]
Homepage = "https://github.com/joyboyreturns/Veystrix"
Issues = "https://github.com/joyboyreturns/Veystrix/issues"

[tool.setuptools.packages.find]
include = ["macqwen*", "models*", "veystrix*"]
